<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a31"/><stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/><stop offset="1" stop-color="#ffb24f" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- motion blur trails -->
  <rect x="28" y="96" width="92" height="10" rx="5" fill="url(#trail)"/>
  <rect x="18" y="123" width="102" height="10" rx="5" fill="url(#trail)"/>
  <rect x="28" y="150" width="92" height="10" rx="5" fill="url(#trail)"/>
  <!-- rotary shutter: 180 degree open sector -->
  <circle cx="150" cy="128" r="72" fill="#121418" stroke="#ffffff" stroke-opacity=".9" stroke-width="8"/>
  <path d="M150 128 L150 56 A72 72 0 0 1 150 200 Z" fill="url(#ac)"/>
  <circle cx="150" cy="128" r="10" fill="#ffffff"/>
  <line x1="150" y1="60" x2="150" y2="196" stroke="#121418" stroke-width="3" stroke-opacity=".5"/>
</svg>
