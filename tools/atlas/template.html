<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlante della logica · S-Log MetaRaw</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1f24;--mute:#6a6f78;--line:#d9dad5;--sel:#2f6fdb;
--event:#7a4fd1;--function:#2f6fdb;--decision:#b07a00;--data:#0f8a6a;--persistence:#c25b12;--process:#4b5563;
--async:#0e7490;--external:#6b7280;--end:#1d1f24;--err:#c0392b;--prop:#8e44ad}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--panel:#1f2228;--ink:#e8e8e6;--mute:#9aa0a8;--line:#353a42;--sel:#6ea2ff;--end:#e8e8e6}}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:14px;margin:0;font-weight:600}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;border:1px solid var(--line);font-size:11px;color:var(--mute);white-space:nowrap}
.chip.warn{border-color:#d9a400;color:#9a7300}.chip.bad{border-color:var(--err);color:var(--err)}.chip.ok{border-color:#2e9e6a;color:#2e9e6a}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:4px 10px;cursor:pointer;font:inherit}
.seg button[aria-pressed=true]{background:var(--sel);color:#fff}
main{display:grid;grid-template-columns:270px 1fr 360px;min-height:0}
nav,aside{background:var(--panel);overflow:auto;min-height:0}
nav{border-right:1px solid var(--line);padding:8px}
aside{border-left:1px solid var(--line);padding:12px}
#search{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:6px}
.tree ul{list-style:none;margin:0;padding-left:14px}.tree>ul{padding-left:0}
.tree li>div{display:flex;gap:4px;align-items:center;padding:2px 4px;border-radius:4px;cursor:pointer}
.tree li>div:hover{background:color-mix(in srgb,var(--sel) 10%,transparent)}
.tree li>div.sel{background:color-mix(in srgb,var(--sel) 20%,transparent)}
.tree .tw{width:12px;color:var(--mute);flex:none;text-align:center}
.tree .lvl{font-size:10px;color:var(--mute);margin-left:auto}
.hidden{display:none!important}
#stage{position:relative;overflow:auto;min-height:0}
#stage .q{position:sticky;left:0;top:0;padding:10px 14px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);z-index:2}
#stage .q b{font-size:14px}
svg text{fill:var(--ink);font:12px system-ui,sans-serif}
.lane rect{fill:var(--panel);stroke:var(--line)}.lane text{fill:var(--mute);font-size:11px}
.node rect,.node polygon{stroke-width:1.5;fill:var(--panel)}
.node{cursor:pointer}.node.sel rect,.node.sel polygon{stroke-width:3;filter:drop-shadow(0 0 3px var(--sel))}
.node .k{font-size:9.5px;fill:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.edge path{fill:none;stroke-width:1.6}.edge{cursor:pointer}.edge .hit{stroke:transparent;stroke-width:12}
.edge text{font-size:10.5px;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.edge.sel path.v{stroke-width:3.2}
.e-request path.v{stroke:#2f6fdb}.e-response path.v{stroke:#2f6fdb;stroke-dasharray:6 4}
.e-call path.v,.e-trigger path.v,.e-control path.v{stroke:#59606b}.e-data path.v{stroke:var(--data)}
.e-async path.v{stroke:var(--async);stroke-dasharray:2 4}.e-error path.v{stroke:var(--err)}
.e-persistence path.v{stroke:var(--persistence)}.e-decision path.v{stroke:var(--decision)}
.e-deduced text{font-style:italic}
.ghost rect{fill:none;stroke:var(--prop);stroke-dasharray:5 4;stroke-width:1.5}.ghost text{fill:var(--prop);font-size:11px}
.dirty-pos rect,.dirty-pos polygon{stroke-dasharray:3 2}
h2{font-size:15px;margin:0 0 4px}h3{font-size:11px;margin:14px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.ref{display:flex;gap:6px;align-items:baseline;margin:3px 0;word-break:break-all}.ref a{color:var(--sel);text-decoration:none}
.ref .chip{flex:none}
.io div{margin:2px 0}
.prop{border:1.5px dashed var(--prop);border-radius:8px;padding:8px;margin:8px 0}
.prop.applicata{border-style:solid;border-color:#2e9e6a}
.prop b{color:var(--prop)}.prop.applicata b{color:#2e9e6a}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);color:var(--ink);font:inherit}
button.act{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;margin:4px 4px 0 0}
button.act:hover{border-color:var(--sel)}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0 0;font-size:11px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:18px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:4px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
#maint ul{padding-left:18px;margin:4px 0}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* Interfaccia */
.surface-head{padding:10px 14px;border-bottom:1px solid var(--line)}
.preview{margin:16px;display:inline-block;min-width:520px}
.rs{background:#28282c;color:#d6d6d6;border-radius:8px;border:1px solid #111;font:12px system-ui,sans-serif;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.rs .title{color:#9a9aa0;font-size:11px;padding:2px 4px 8px;border-bottom:1px solid #3a3a40;margin-bottom:6px}
.rs [data-id]{cursor:pointer;border-radius:3px;outline:1px solid transparent}
.rs [data-id]:hover{outline-color:#5a8dee80}
.rs .sel{outline:2px solid #5a8dee!important}
.rs .drafted{outline:2px dashed var(--prop)!important}
.rs .vg{display:flex;flex-direction:column;gap:4px;padding:2px}
.rs .hg{display:flex;flex-direction:row;gap:4px;align-items:center;padding:2px}
.rs .btn{background:#3b3b41;border:1px solid #4a4a52;border-radius:4px;padding:3px 9px;white-space:nowrap;color:#e6e6e6}
.rs .lbl{padding:2px 4px;color:#cfcfd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .lbl.empty{color:#6c6c74;font-style:italic}
.rs .cmb{background:#1e1e22;border:1px solid #4a4a52;border-radius:4px;padding:3px 8px;min-width:150px;color:#e6e6e6}
.rs .chk{display:flex;gap:5px;align-items:center;white-space:nowrap}
.rs .box{width:12px;height:12px;border:1px solid #777;border-radius:2px;background:#1e1e22;display:inline-block;flex:none}
.rs .box.on{background:#5a8dee;border-color:#5a8dee}
.rs .tree{background:#1e1e22;border:1px solid #3a3a40;border-radius:4px;min-height:90px;padding:6px;color:#6c6c74}
.ofx{width:400px}
.ofx .row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;padding:3px 6px}
.ofx .row .l{color:#bdbdc3;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofx .val{display:flex;gap:6px;align-items:center}
.ofx .num{background:#1e1e22;border:1px solid #3a3a40;border-radius:3px;padding:1px 5px;min-width:52px;text-align:right;color:#e6e6e6}
.ofx .bar{flex:1;height:4px;background:#45454c;border-radius:2px;position:relative}
.ofx .bar i{position:absolute;top:-4px;width:8px;height:12px;border-radius:2px;background:#cfcfd4;transform:translateX(-50%)}
.ofx .grp{margin-top:6px;border-top:1px solid #3a3a40}
.ofx .grp>.gh{display:flex;gap:6px;align-items:center;padding:5px 6px;color:#e6e6e6;font-weight:600}
.ofx .grp>.gh .tw{color:#9a9aa0;width:12px}
.ofx .wide{padding:3px 6px}.ofx .wide .btn{display:block;text-align:center}
.ofx .info{color:#9a9aa0}
.ofx .icon{font-size:10px;color:#9a9aa0;border:1px solid #4a4a52;border-radius:3px;padding:0 4px}
.ofx .hiddenlist{color:#6c6c74;font-size:11px;padding:6px}
.catalog{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);cursor:pointer}
.card.sel{border-color:var(--sel);box-shadow:0 0 0 2px color-mix(in srgb,var(--sel) 30%,transparent)}
.card b{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;font-size:12px}.kv div:nth-child(odd){color:var(--mute)}
.draft label{display:block;font-size:11px;color:var(--mute);margin-top:6px}
.draft input,.draft textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);color:var(--ink);font:inherit}
.warnbox{border-left:3px solid #d9a400;padding:4px 8px;margin:8px 0;background:color-mix(in srgb,#d9a400 8%,transparent)}
</style>
</head>
<body>
<header>
  <h1>Atlante della logica</h1>
  <span id="rev" class="chip"></span>
  <span id="cov" class="chip"></span>
  <div class="seg" role="group" aria-label="Modalità">
    <button data-mode="naviga">Naviga</button><button data-mode="annota">Annota</button>
  </div>
  <div class="seg" role="group" aria-label="Vista">
    <button data-view="flusso">Atlante</button><button data-view="interfaccia">Interfaccia</button><button data-view="manutenzione">Manutenzione</button>
  </div>
  <label class="chip"><input type="checkbox" id="showProps"> proposte</label>
  <span style="margin-left:auto" class="chip" title="Spostare un blocco cambia solo la disposizione di questa vista nel tuo browser: non modifica il programma né il modello">trascinare = solo vista</span>
</header>
<main>
  <nav><input id="search" type="search" placeholder="Cerca blocchi, funzioni, moduli…" aria-label="Cerca"><div class="tree" id="tree"></div></nav>
  <section id="stage"></section>
  <aside id="panel"></aside>
</main>
<div class="toast" id="toast"></div>
<script>
const A = /*__ATLAS_DATA__*/null;
const M = A.model, F = A.facts, REV = A.revision;
const KEY = 'slogmetaraw-atlas/ui';
// editor state, separate from the model: survives rebuilds because every element has a stable id
const S = Object.assign({open:{prog:true}, search:'', scroll:0, sel:null, beh:M.behaviours[0].id, mode:'naviga',
  view:'flusso', props:true, notes:{}, pos:{}, surface:'ui:script', uiOpen:{}, drafts:{}}, load());
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}

// --- index of every selectable element -------------------------------------------------------------------
const IDX = {};
IDX.prog = {type:'programma', el:M.program};
for (const s of M.subsystems) IDX[s.id] = {type:'sottosistema', el:s};
for (const b of M.behaviours){
  IDX[b.id] = {type:'comportamento', el:b};
  for (const n of b.nodes) IDX[b.id+'/'+n.id] = {type:'blocco', el:n, beh:b};
  for (const e of b.edges) IDX[b.id+'/'+e.id] = {type:'collegamento', el:e, beh:b};
  for (const p of b.proposals||[]) IDX[b.id+'/'+p.id] = {type:'proposta', el:p, beh:b};
}
const U = A.ui;
(function indexUI(){
  const walk = w => { IDX[w.id] = {type:'widget', el:w, surface:'ui:script'}; w.children.forEach(walk); };
  IDX['ui:script'] = {type:'superficie', el:U.script}; walk(U.script.root);
  for (const pn of U.panels){ IDX[pn.id] = {type:'superficie', el:pn}; for (const q of pn.params) IDX[q.id] = {type:'parametro', el:q, surface:pn.id}; }
  for (const c of U.components) IDX[c.id] = {type:'componente', el:c, surface:'catalog'};
  IDX['catalog'] = {type:'superficie', el:{label:'Catalogo componenti', source:'Componenti condivisi estratti: helper define* del plugin e tipi di widget dello script, con i loro utilizzi.'}};
})();
for (const id in F.modules) IDX['mod:'+id] = {type:'modulo', el:{id, label:id.split('/').pop(), ...F.modules[id]}};

// --- header -----------------------------------------------------------------------------------------------
function header(){
  const r = $('#rev');
  r.textContent = 'rev ' + (REV.short||'?') + ' · v' + REV.version + (REV.dirty.length ? ' · modifiche locali ' + REV.dirty.length : '');
  r.className = 'chip' + (REV.dirty.length ? ' warn' : '');
  r.title = 'Revisione da cui è stato estratto il modello' + (REV.dirty.length ? '\nFile modificati non committati:\n' + REV.dirty.join('\n') : '');
  const c = A.coverage, n = c.problems.length, st = c.stale.length;
  const cv = $('#cov');
  cv.textContent = n ? n + ' riferimenti rotti' : st ? st + ' da rivedere' : 'riferimenti ok';
  cv.className = 'chip ' + (n ? 'bad' : st ? 'warn' : 'ok');
  cv.style.cursor = 'pointer'; cv.onclick = () => setView('manutenzione');
  document.querySelectorAll('[data-mode]').forEach(b => {b.setAttribute('aria-pressed', S.mode===b.dataset.mode); b.onclick=()=>{S.mode=b.dataset.mode;save();header()}});
  document.querySelectorAll('[data-view]').forEach(b => {b.setAttribute('aria-pressed', S.view===b.dataset.view); b.onclick=()=>setView(b.dataset.view)});
  $('#showProps').checked = S.props; $('#showProps').onchange = e => {S.props=e.target.checked;save();stage()};
}
function setView(v){S.view=v;save();header();tree();stage();panel()}

// --- navigation tree: programma → sottosistema → comportamento → blocco → funzione ---------------------
function tree(){
  if (S.view==='interfaccia') return uiTree();
  const q = S.search.trim().toLowerCase();
  const li = (id, label, lvl, kids) => {
    const has = kids && kids.length, open = q ? true : !!S.open[id];
    return `<li data-id="${esc(id)}"><div class="${S.sel===id?'sel':''}" data-id="${esc(id)}"><span class="tw" data-tw="${esc(id)}">${has?(open?'▾':'▸'):''}</span><span>${esc(label)}</span><span class="lvl">${lvl}</span></div>${has?`<ul class="${open?'':'hidden'}">${kids.join('')}</ul>`:''}</li>`;
  };
  const match = (...t) => !q || t.join(' ').toLowerCase().includes(q);
  const fnItems = n => (n.refs||[]).filter(r=>r.code).map(r => match(r.code, n.label) ? li('fn:'+r.code, r.code.split('::')[1], 'funzione') : '').filter(Boolean);
  const subs = M.subsystems.map(s => {
    const behs = M.behaviours.filter(b => b.subsystem===s.id).map(b => {
      const nodes = b.nodes.map(n => {const f = fnItems(n); return (match(n.label, n.text) || f.length) ? li(b.id+'/'+n.id, n.label, n.kind, f) : ''}).filter(Boolean);
      return (match(b.label, b.question) || nodes.length) ? li(b.id, b.label, 'comportamento', nodes) : '';
    }).filter(Boolean);
    const mods = (s.modules||[]).filter(m => match(m)).map(m => li('mod:'+m, m.split('/').pop(), 'modulo'));
    return (match(s.label) || behs.length || mods.length) ? li(s.id, s.label, 'sottosistema', [...behs, ...mods]) : '';
  }).filter(Boolean);
  $('#tree').innerHTML = '<ul>' + li('prog', M.program.label, 'programma', subs) + '</ul>';
}
$('#tree').addEventListener('click', e => {
  const tw = e.target.closest('[data-tw]');
  const row = e.target.closest('div[data-id]'); if (!row) return;
  const id = row.dataset.id;
  if (tw && tw.textContent){ S.open[id] = !S.open[id]; save(); tree(); return; }
  select(id, true);
});
$('#search').value = S.search;
$('#search').addEventListener('input', e => {S.search = e.target.value; save(); tree()});
$('nav').addEventListener('scroll', e => {S.scroll = e.target.scrollTop; save()}, {passive:true});

// keep the selected element visible in the tree: open its ancestors (never closes what the user opened)
function reveal(id){
  const it = IDX[id]; S.open.prog = true;
  if (it && it.surface){
    S.open[it.surface] = true;
    if (it.type==='widget'){ const path = []; const find = (w, acc) => { if (w.id===id){ path.push(...acc); return true; } return w.children.some(c => find(c, [...acc, w.id])); }; find(U.script.root, []); path.forEach(x => S.open[x] = true); }
    if (it.type==='parametro'){ const pn = panelOf(it.surface); let q = it.el; while (q && q.parent){ const g = pn.params.find(x => x.name===q.parent); if (!g) break; S.open[g.id] = true; S.uiOpen[g.id] = true; q = g; } if (it.el.secret==='1') S.open[it.surface+'#hidden'] = true; }
    if (it.type==='componente'){ S.open.catalog = true; S.open['fam:'+it.el.family] = true; }
  }
  const b = it && (it.beh || (it.type==='comportamento' ? it.el : null));
  if (b){ S.open[b.subsystem] = true; if (it.beh) S.open[b.id] = true; }
}
function select(id, fromTree){
  if (id.startsWith('fn:')) { S.sel = id; }
  else if (IDX[id]) {
    S.sel = id;
    const it = IDX[id];
    if (it.type==='comportamento') S.beh = id;
    if (it.beh) S.beh = it.beh.id;
    if (it.surface) S.surface = it.surface;
    if (it.type==='superficie') S.surface = id;
    if (fromTree && it.type==='comportamento') S.open[id] = true;
  }
  reveal(S.sel);
  if (S.mode==='annota') S.noteFocus = true;
  save(); tree(); stage(); panel();
}

// --- diagram ------------------------------------------------------------------------------------------------
const CW = 168, RH = 104, NW = 138, NH = 54, LX = 120, TOP = 10;
function posOf(b, n){
  const own = (S.pos[b.id]||{})[n.id], p = own || b.view.pos[n.id];   // [column, lane index]
  return {x: LX + p[0]*CW + 12, y: TOP + p[1]*RH + (RH-NH)/2, moved: !!own};
}
function stage(){
  const st = $('#stage');
  if (S.view==='manutenzione'){ st.innerHTML = maint(); return; }
  if (S.view==='interfaccia'){ st.innerHTML = uiStage(); st.scrollTop = (S.uiScroll||{})[S.surface]||0; return; }
  const b = M.behaviours.find(x => x.id===S.beh) || M.behaviours[0];
  const cols = Math.max(...Object.values(b.view.pos).map(p => p[0])) + 1;
  const W = LX + cols*CW + 40, H = TOP + b.view.lanes.length*RH + 70;
  const P = {}; for (const n of b.nodes) P[n.id] = posOf(b, n);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${['#59606b','#2f6fdb','#0f8a6a','#0e7490','#c0392b','#c25b12','#b07a00'].map((c,i)=>`<marker id="m${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`).join('')}</defs>`;
  b.view.lanes.forEach((l, i) => svg += `<g class="lane"><rect x="4" y="${TOP+i*RH}" width="${W-8}" height="${RH-4}" rx="6"/><text x="12" y="${TOP+i*RH+18}">${esc(M.lanes[l]||l)}</text></g>`);
  const mk = {request:1,response:1,call:0,trigger:0,control:0,data:2,async:3,error:4,persistence:5,decision:6};
  for (const e of b.edges){
    const a = P[e.from], z = P[e.to]; if (!a||!z) continue;
    const back = b.edges.some(o => o.from===e.to && o.to===e.from);
    const off = back ? (e.kind==='response' || e.kind==='error' ? 8 : -8) : 0;
    let x1 = a.x+NW/2, y1 = a.y+NH/2+off, x2 = z.x+NW/2, y2 = z.y+NH/2+off;
    // leave/enter on the box edge
    const dx = x2-x1, dy = y2-y1;
    if (Math.abs(dx)*NH > Math.abs(dy)*NW){ x1 += Math.sign(dx)*NW/2; x2 -= Math.sign(dx)*NW/2; }
    else { y1 += Math.sign(dy)*NH/2; y2 -= Math.sign(dy)*NH/2; }
    const d = `M${x1},${y1} C${x1+(x2-x1)*.5},${y1} ${x1+(x2-x1)*.5},${y2} ${x2},${y2}`;
    const id = b.id+'/'+e.id, ded = e.evidence==='dedotto';
    svg += `<g class="edge e-${e.kind} ${ded?'e-deduced':''} ${S.sel===id?'sel':''}" data-id="${esc(id)}"><path class="hit" d="${d}"/><path class="v" d="${d}" marker-end="url(#m${mk[e.kind]??0})"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2 - 4 + (off>0?14:0)}" text-anchor="middle">${esc(trim(e.label, 34))}</text></g>`;
  }
  const shape = {decision:'diamond', event:'pill', end:'pill'};
  for (const n of b.nodes){
    const p = P[n.id], id = b.id+'/'+n.id, col = `var(--${n.kind})`;
    const sh = shape[n.kind]==='diamond'

function trim(s, n){ s = String(s); return s.length > n ? s.slice(0, n-1) + '…' : s }
function wrap(s, n){ const w = String(s).split(' '), out = ['']; for (const x of w){ if ((out[out.length-1]+' '+x).trim().length > n) out.push(x); else out[out.length-1] = (out[out.length-1]+' '+x).trim(); } if (out.length>2) out[1] = trim(out.slice(1).join(' '), n); return out }

function context(id){

        case 'VGroup': case 'HGroup': return `<div class="${w.type==='VGroup'?'vg':'hg'}${cls(w.id)}" data-id="${esc(w.id)}" style="${wt}">${w.children.map(r).join('')}</div>`;
        case 'Button': return `<span class="btn${cls(w.id)}" data-id="${esc(w.id)}" title="${tip}" style="${wt}">${esc(txt || w.widget_id)}</span>`;
        case 'Label': return `<span class="lbl${txt?'':' empty'}${cls(w.id)}" data-id="${esc(w.id)}" title="${tip}" style="${wt}">${esc(txt || '‹' + w.widget_id + ': testo a runtime›')}</span>`;
        case 'ComboBox': return `<span class="cmb${cls(w.id)}" data-id="${esc(w.id)}" title="${tip}" style="${wt}">‹${esc(w.widget_id)}› ▾</span>`;
        case 'CheckBox': return `<span class="chk${cls(w.id)}" data-id="${esc(w.id)}" title="${tip}" style="${wt}"><i class="box${p.Checked?' on':''}"></i>${esc(txt)}</span>`;
        case 'Tree': return `<div class="tree${cls(w.id)}" data-id="${esc(w.id)}" style="${wt}${p.MinimumSize?'min-height:'+p.MinimumSize[1]+'px;':''}">${esc(w.widget_id)} · albero, righe e colonne a runtime</div>`;
        default: return `<span class="lbl${cls(w.id)}" data-id="${esc(w.id)}">${esc(w.type)}</span>`;
      }
    };
    const title = tr(U.script.window.WindowTitle).replace('%s', '{versione}');
    const g = U.script.window.Geometry;
    return head('Finestra dello script', U.script.source) + `<div class="preview"><div class="rs" style="width:860px"><div class="title">${esc(title)}</div>${r(U.script.root)}</div><div style="color:var(--mute);font-size:11px;margin-top:6px">Dimensioni reali calcolate a runtime sulla finestra di Resolve (680–1000 × 400–620 px).</div></div>`;
  }
  const pn = panelOf(sid); if (!pn) return '';
  const row = q => {
    const t = q.type.replace('OfxParamType',''), id = q.id, label = draft(id, 'label', q.label), def = draft(id, 'default', q['default']);
    const tip = esc(draft(id, 'hint', q.hint));
    if (t === 'Group'){
      const open = S.uiOpen[id] != null ? S.uiOpen[id] : q.groupOpen === '1';
      return `<div class="grp"><div class="gh${cls(id)}" data-id="${esc(id)}"><span class="tw" data-gt="${esc(id)}">${open?'▾':'▸'}</span>${esc(label)}</div>${open?groupKids(pn, q.name).map(row).join(''):''}</div>`;
    }
    if (t === 'PushButton') return `<div class="wide"><span class="btn${cls(id)}" data-id="${esc(id)}" title="${tip}">${esc(label)}</span></div>`;
    if (t === 'Boolean') return `<div class="row${cls(id)}" data-id="${esc(id)}" title="${tip}"><span class="l"></span><span class="val"><i class="box${def==='1'?' on':''}"></i>${esc(label)}${q.icon?` <span class="icon">${esc(q.icon)}</span>`:''}</span></div>`;
    if (t === 'Choice') return `<div class="row${cls(id)}" data-id="${esc(id)}" title="${tip}"><span class="l">${esc(label)}</span><span class="val"><span class="cmb">${esc(q.options[+def] ?? def)} ▾</span></span></div>`;
    if (t === 'Double' || t === 'Integer'){
      const lo = +(q.displayMin || q.min || 0), hi = +(q.displayMax || q.max || 1), v = +def;
      const pct = hi > lo ? Math.min(100, Math.max(0, (v - lo) / (hi - lo) * 100)) : 0;
      return `<div class="row${cls(id)}" data-id="${esc(id)}" title="${tip}"><span class="l">${esc(label)}</span><span class="val"><span class="num">${esc(def)}</span><span class="bar"><i style="left:${pct}%"></i></span></span></div>`;
    }
    if (t === 'String') return `<div class="row${cls(id)}" data-id="${esc(id)}" title="${tip}"><span class="l">${esc(label)}</span><span class="val info">${esc(def)}</span></div>`;
    return '';
  };
  const top = pn.params.filter(q => !q.parent && q.secret !== '1' && q.type !== 'OfxParamTypePage');
  const hidden = pn.params.filter(q => q.secret === '1');
  return head(pn.label, pn.source) + `<div class="preview"><div class="rs ofx"><div class="title">${esc(pn.label)} · Inspector › Settings</div>${top.map(row).join('')}<div class="hiddenlist">${hidden.length} parametri nascosti (stato salvato col nodo, non visibili): ${hidden.map(h=>`<span data-id="${esc(h.id)}" class="${cls(h.id)}">${esc(h.name)}</span>`).join(', ')}</div></div><div style="color:var(--mute);font-size:11px;margin-top:6px">Valori mostrati = default del plugin. Gruppi aperti/chiusi come il default del plugin finché non li cambi qui (solo vista).</div></div>`;
}
$('#stage').addEventListener('click', e => {
  const gt = e.target.closest('[data-gt]');
  if (gt && S.view==='interfaccia' && S.mode==='naviga'){
    const q = IDX[gt.dataset.gt].el, cur = S.uiOpen[q.id] != null ? S.uiOpen[q.id] : q.groupOpen === '1';
    S.uiOpen[q.id] = !cur; save(); stage(); e.stopPropagation();
  }
}, true);
function link(file, line){ const u = gh(file, line); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener" class="mono">${esc(file)}${line?':'+line:''}</a>` : `<span class="mono">${esc(file)}:${line}</span>`; }
function uiPanel(id, it){
  const el = it.el, p = $('#panel');
  let h = `<div class="chip">${it.type}</div> `;
  if (it.type === 'widget'){
    const pr = el.props;
    h += `<span class="chip ok">struttura estratta</span><h2>${esc(el.widget_id || el.type)}</h2><div class="mono" style="color:var(--mute)">${esc(id)}</div>`;
    h += `<div class="kv" style="margin-top:8px"><div>tipo</div><div>ui.${esc(el.type)}</div>${Object.entries(pr).filter(([k])=>k!=='ID').map(([k,v])=>`<div>${esc(k)}</div><div>${esc(Array.isArray(v)?JSON.stringify(v):typeof v==='object'?tr(v)+(v.t!=null?' (tradotto con t())':''):v)}</div>`).join('')}</div>`;
    h += `<h3>Fonte</h3>${link(U.script.file, el.line)}`;
    h += `<h3>Componente</h3><a href="#" data-sel="comp:script.${esc(el.type)}">comp:script.${esc(el.type)}</a>`;
    const bs = el.bindings || [];
    h += `<h3>Eventi collegati</h3>` + (bs.length ? bs.map(b => { const f = F.bindings[b]; const behs = M.behaviours.filter(x => [x, ...x.nodes].some(n => (n.refs||[]).some(r => r.binding===b)));
      return `<div class="mono">${esc(b)} → ${f.handler?`<a href="#" data-fn="${esc(f.handler)}">${esc(f.handler.split('::')[1])}</a>`:esc(f.handler_name)}</div>${behs.map(x=>`<div>Atlante: <a href="#" data-sel="${esc(x.id)}" data-goview="flusso">${esc(x.question)}</a></div>`).join('')}`; }).join('') : '<div style="color:var(--mute)">nessuno (o letto solo dal codice)</div>');
    h += draftHtml(id, [['Text', tr(pr.Text)], ['ToolTip', tr(pr.ToolTip)]]);
  } else if (it.type === 'parametro'){
    const t = el.type.replace('OfxParamType','');
    h += `<span class="chip ok">struttura verificata</span><h2>${esc(el.label || el.name)}</h2><div class="mono" style="color:var(--mute)">${esc(id)}</div>`;
    h += `<div class="warnbox">Il nome <span class="mono">${esc(el.name)}</span> è permanente: Resolve salva i nodi per nome, rinominarlo o toglierlo perde le correzioni salvate (ParamDefs.h).</div>`;
    const rows = [['tipo', t], ['etichetta', el.label], ['default', t==='Choice' ? `${el['default']} (${el.options[+el['default']]})` : el['default']], ['gruppo', el.parent], ['intervallo', el.min||el.max ? `${el.min} … ${el.max}` : ''], ['cursore', el.displayMin||el.displayMax ? `${el.displayMin} … ${el.displayMax}` : ''], ['passo', el.increment], ['cifre', el.digits], ['animabile', el.animates], ['opzioni', el.options.join(' · ')], ['icona', el.icon], ['nascosto', el.secret === '1' ? 'sì' : ''], ['aperto', t==='Group' ? (el.groupOpen==='1'?'sì':'no') : '']].filter(r => r[1]);
    h += `<div class="kv" style="margin-top:8px">${rows.map(([k,v])=>`<div>${k}</div><div>${esc(v)}</div>`).join('')}</div>`;
    if (el.hint) h += `<h3>Suggerimento (tooltip)</h3><p>${esc(el.hint)}</p>`;
    h += `<h3>Fonti</h3><div>definizione: ${el.define ? link(el.define.file, el.define.line) + ` <span class="chip">${esc(el.define.how)}</span>` : '<span class="chip bad">non trovata</span>'}</div>`;
    h += el.handlers.length ? `<div>gestito in: ${el.handlers.map(x => link(x.file, x.line)).join(', ')}</div>` : '';
    h += `<div>verificato in: ${link(panelOf(it.surface).golden, null)} <span class="chip">tests/test_ofx_host.py</span></div>`;
    const cites = [];
    for (const b of M.behaviours) for (const n of b.nodes) if ((n.refs||[]).some(r => r.param===id)) cites.push([b, n]);
    h += `<h3>Nell'Atlante</h3>` + (cites.length ? cites.map(([b,n]) => `<div><a href="#" data-sel="${esc(b.id+'/'+n.id)}" data-goview="flusso">${esc(b.label)} › ${esc(n.label)}</a></div>`).join('') : '<div style="color:var(--mute)">non ancora in un comportamento</div>');
    h += `<h3>Componente</h3><a href="#" data-sel="${esc(el.component)}">${esc(el.component)}</a> <span class="chip">dedotto dal tipo</span>`;
    h += draftHtml(id, [['label', el.label], ['hint', el.hint], ['default', el['default']]]);
  } else if (it.type === 'componente'){
    h += `<span class="chip ok">estratto</span><h2 class="mono">${esc(el.name)}</h2><div class="mono" style="color:var(--mute)">${esc(id)}</div>`;
    if (el.file) h += `<h3>Definizione</h3>${link(el.file, el.line)}`;
    const vs = {};
    for (const u of el.uses){ const x = IDX[u]; if (x && x.type==='parametro'){ const k = x.surface; vs[k] = (vs[k]||0) + 1; } }
    h += `<h3>Utilizzi (${el.uses.length})</h3>` + (Object.keys(vs).length ? `<div style="color:var(--mute)">${Object.entries(vs).map(([k,n])=>`${esc(k)}: ${n}`).join(' · ')}</div>` : '') + el.uses.map(u => `<div><a class="mono" href="#" data-sel="${esc(u)}">${esc(u)}</a></div>`).join('');
    h += `<p style="color:var(--mute)">Una modifica al componente vale per tutti gli utilizzi che ne ereditano le proprietà; un'eccezione locale va proposta sull'utilizzo, motivata.</p>`;
  } else {
    h += `<h2>${esc(el.label)}</h2><p>${esc(el.source||'')}</p>`;
    if (el.params) h += `<p>${el.params.filter(q=>q.secret!=='1').length} controlli visibili, ${el.params.filter(q=>q.secret==='1').length} nascosti.</p>`;
  }
  h += proposalsSummary();
  h += notesHtml(id);
  p.innerHTML = h; wirePanel(id); wireDraft(id);
}
function draftHtml(id, fields){
  const d = S.drafts[id] || {};
  return `<h3>Proposta di modifica al programma</h3><div class="draft">${fields.map(([f, cur]) => `<label>${esc(f)} <span class="mono" style="color:var(--mute)">(ora: ${esc(trim(cur||'—', 60))})</span></label>${f==='hint'||f==='ToolTip'?`<textarea data-draft="${esc(f)}" rows="2">${esc(d[f]||'')}</textarea>`:`<input data-draft="${esc(f)}" value="${esc(d[f]||'')}">`}`).join('')}<label>altro (posizione, gruppo, comportamento…)</label><textarea data-draft="altro" rows="2">${esc(d.altro||'')}</textarea></div>`;
}
function proposalsSummary(){
  const n = Object.keys(S.drafts).length;
  return `<h3>Proposte aperte (${n})</h3>${n?Object.keys(S.drafts).map(k=>`<div><a href="#" data-sel="${esc(k)}" class="mono">${esc(k)}</a></div>`).join(''):'<div style="color:var(--mute)">nessuna</div>'}<button class="act" id="copyDrafts"${n?'':' disabled'}>Copia proposte per l’agente</button><button class="act" id="clearDrafts"${n?'':' disabled'}>Scarta tutte</button>`;
}
function wireDraft(id){
  const p = $('#panel');
  p.querySelectorAll('[data-draft]').forEach(inp => inp.oninput = () => {
    const d = S.drafts[id] = S.drafts[id] || {}; d[inp.dataset.draft] = inp.value;
    if (!Object.values(d).some(v => v)) delete S.drafts[id];
    save(); stage();
  });
  const c = $('#copyDrafts'); if (c) c.onclick = async () => { const t = draftsText(); try { await navigator.clipboard.writeText(t); toast('Proposte copiate: incollale nella conversazione'); } catch(e){ $('#note').value = t; toast('Copia non permessa: testo nel riquadro nota'); } };
  const x = $('#clearDrafts'); if (x) x.onclick = () => { S.drafts = {}; save(); stage(); panel(); };
}
function draftsText(){
  const L = ['[Configuratore interfaccia S-Log MetaRaw] proposte di modifica', 'revisione: ' + (REV.commit||'?'), ''];
  for (const [id, d] of Object.entries(S.drafts)){
    const it = IDX[id]; if (!it) continue; const el = it.el;
    L.push('- ' + id + ' (' + it.type + ', ' + (it.surface||'') + ')');
    const src = it.type==='parametro' ? (el.define ? el.define.file + ':' + el.define.line : '?') : it.type==='widget' ? U.script.file + ':' + el.line : '';
    if (src) L.push('  fonte: ' + src);
    for (const [f, v] of Object.entries(d)) if (v){
      const cur = it.type==='parametro' ? el[f] : tr(el.props && el.props[f]);
      L.push(f==='altro' ? '  altro: ' + v : `  ${f}: «${cur ?? ''}» → «${v}»`);
    }
    if (S.notes[id]) L.push('  nota: ' + S.notes[id]);
  }
  L.push('', 'Vincoli: i nomi dei parametri OFX sono permanenti (Resolve salva i nodi per nome); un cambio al pannello aggiorna tests/golden/params_*.txt di proposito; i testi dello script passano da i18n (t()) e vanno tradotti; dopo la modifica rigenerare con tools/atlas/atlas.py e verificare.');
  return L.join('\n');
}

// --- maintenance view (seed of the fourth configurator) ------------------------------------------------------
function maint(){
  const c = A.coverage, g = c.graphify;
  const li = a => a.length ? '<ul>' + a.map(x=>`<li>${esc(x)}</li>`).join('') + '</ul>' : '<p style="color:var(--mute)">nessuno</p>';
  return `<div id="maint" style="padding:14px 18px;max-width:860px"><h2>Manutenzione e copertura</h2>
  <p>Revisione <span class="mono">${esc(REV.commit||'?')}</span> (${esc(REV.branch||'')}) · versione ${esc(REV.version)} · schema ${esc(A.schema)}${REV.dirty.length?` · <b>${REV.dirty.length} file con modifiche locali</b> inclusi nell’estrazione`:''}</p>
  <h3>Riferimenti rotti</h3>${li(c.problems)}
  <h3>Da rivedere (codice cambiato dopo la revisione del modello)</h3>${li(c.stale)}
  <h3>Codice citato senza impronta revisionata</h3>${li(c.unreviewed||[])}
  <h3>Moduli non assegnati a un sottosistema</h3>${li(c.modules_unassigned)}
  <h3>Graphify (docs/GRAPHIFY.md, mappa manuale)</h3><p>Stato: <b>${esc(g.status)}</b> · documentata ${esc(g.documented_version)} · corrente ${esc(g.current_version)}</p>${g.modules_missing&&g.modules_missing.length?'<p>Moduli non citati:</p>'+li(g.modules_missing):''}
  <h3>Estratto automaticamente</h3>${li(c.extracted)}
  <h3>Non estratto (manuale o assente)</h3>${li(c.not_extracted)}
  <h3>Test citati</h3><p>${c.tests_run?'Eseguiti durante la generazione: esito nei chip dei riferimenti.':'Non eseguiti in questa generazione: i chip dicono solo che il test esiste. Rigenera con --run-tests.'}</p>
  <h3>Comportamenti modellati</h3>${li(M.behaviours.map(b=>b.question + ' (' + b.nodes.length + ' blocchi, ' + b.edges.length + ' collegamenti)'))}
  <h3>Disposizioni spostate in questa vista</h3><p>${Object.keys(S.pos).length?`<button class="act" id="copyPos">Copia disposizione per il modello</button> <button class="act" id="resetPos">Ripristina</button>`:'nessuna'}</p></div>`;
}
document.addEventListener('click', async e => {
  if (e.target.id==='copyPos'){ const txt = JSON.stringify(S.pos, null, 1); try{await navigator.clipboard.writeText(txt); toast('Copiata')}catch(_){toast('Copia non permessa')} }
  if (e.target.id==='resetPos'){ S.pos = {}; save(); stage(); }
});

reveal(S.sel || S.beh); header(); tree(); stage(); panel();
requestAnimationFrame(() => { $('nav').scrollTop = S.scroll||0; });
</script>
</body>
