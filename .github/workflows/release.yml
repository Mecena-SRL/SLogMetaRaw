name: Release packages
# Builds the Linux and Windows packages and attaches them to a DRAFT release for the tag; the macOS .dmg is built
# by hand (packaging/build_installer.sh) and uploaded to the same release before publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./packaging/linux/build_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    # experimental: a failing Windows build must not block the draft with the other packages
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe

  draft:
    needs: [linux, windows]
    # the draft is made from whatever packages were built; Linux is required, Windows is optional
    if: ${{ !cancelled() && needs.linux.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
