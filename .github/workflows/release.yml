name: Release packages
# Builds the macOS .dmg and the Linux and Windows packages and attaches them to a DRAFT release for the tag.
# Without a tag: Actions > Release packages > Run workflow on main with the version (e.g. 2.3.3); the tag vX.Y.Z is
# created on that commit and the release is published with the RELEASE_NOTES.md section, unless "draft" is ticked.
# Run without a version it only builds the packages (artifacts of the run, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.3.3); empty = build the packages only'
        required: false
        default: ''
      draft:
        description: 'Draft only: publish it by hand from GitHub'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux-packages:
    uses: ./.github/workflows/linux-packages.yml

  windows:
    runs-on: windows-latest
    # experimental: a failing Windows build must not block the draft with the other packages
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe

  macos:
    # packaging/build_installer.sh, as on a developer's Mac. The runner has no Resolve: the SDK is the upstream OpenFX
    # one at the commit CMakeLists.txt pins (the one the macOS CI tests run against), laid out as Resolve's Developer
    # folder, with compat/ofxImageEffectExt.h standing in for Resolve's extension header.
    runs-on: macos-15    # the Metal code needs the macOS 15 SDK, as in ci.yml
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: OpenFX SDK in the Resolve layout
        run: |
          COMMIT="$(sed -n 's/^ *GIT_TAG \([0-9a-f]\{40\}\).*/\1/p' ofx/SLogMetaRaw/CMakeLists.txt)"
          test -n "$COMMIT"
          git init -q "$RUNNER_TEMP/openfx"
          git -C "$RUNNER_TEMP/openfx" fetch -q --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git "$COMMIT"
          git -C "$RUNNER_TEMP/openfx" checkout -q FETCH_HEAD
          SDK="$RUNNER_TEMP/ofxsdk"
          mkdir -p "$SDK/OpenFX-1.4"
          cp -R "$RUNNER_TEMP/openfx/include" "$SDK/OpenFX-1.4/include"
          cp -R "$RUNNER_TEMP/openfx/Support" "$SDK/Support"
          cp ofx/SLogMetaRaw/compat/ofxImageEffectExt.h "$SDK/OpenFX-1.4/include/"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
      - name: Disk image
        run: ./packaging/build_installer.sh
      - name: Check the plugin inside the package
        run: |
          A="$(lipo -archs ofx/SLogMetaRaw/SLogMetaRaw.ofx.bundle/Contents/MacOS/SLogMetaRaw.ofx)"; [[ $A == *x86_64* && $A == *arm64* ]]
          codesign --verify ofx/SLogMetaRaw/SLogMetaRaw.ofx.bundle
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*.dmg

  draft:
    needs: [linux-packages, windows, macos]
    # the release is made from whatever packages were built; Linux and macOS are required, Windows is optional
    if: ${{ !cancelled() && needs.linux-packages.result == 'success' && needs.macos.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and notes
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          VERSION="${TAG#v}"
          grep -q "^__version__ = '${VERSION}'$" slogmetaraw/__init__.py \
            || { echo "::error::$TAG is not slogmetaraw.__version__"; exit 1; }
          # the "## S-Log MetaRaw X.Y.Z" section of RELEASE_NOTES.md, without its heading
          awk -v h="## S-Log MetaRaw ${VERSION}" '$0 == h {on = 1; next} on && /^## / {exit} on' RELEASE_NOTES.md \
            > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::no section for ${VERSION} in RELEASE_NOTES.md"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package*'    # linux-packages, windows-package, macos-package; not the intermediate linux-plugin
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: S-Log MetaRaw ${{ steps.meta.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          # a pushed tag keeps making a draft; Run workflow publishes unless "draft" is ticked
          draft: ${{ inputs.version == '' || inputs.draft }}
          files: dist/*
