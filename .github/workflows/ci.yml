name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Version consistency
        run: python3 tools/check_version.py
      - name: Unit tests (builds the plugin and the C++ test helpers with CMake)
        # macOS-only tests (Metal, sample clips, install.sh) skip themselves on Linux
        run: python3 -m unittest discover -s tests -v
      - name: Package
        run: ./packaging/linux/build_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (Python; the C++ helpers are built with MSVC by the package step)
        continue-on-error: true   # the suite was written for macOS: tighten once it is green on Windows
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe
