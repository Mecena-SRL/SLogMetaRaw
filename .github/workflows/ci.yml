name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Version consistency
        run: python3 tools/check_version.py
      - name: Unit tests (builds the plugin and the C++ test helpers with CMake)
        # macOS-only tests (Metal, sample clips, install.sh) skip themselves on Linux
        run: python3 -m unittest discover -s tests -v

  linux-packages:
    uses: ./.github/workflows/linux-packages.yml

  audio:
    # Log MetaRaw Audio (VST3): builds the plugin and runs Steinberg's validator on it (a post-build step that fails
    # the build). Linux only checks the code: Resolve loads VST3 on macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for VSTGUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-util-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb-keysyms1-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libgtkmm-3.0-dev \
            libsqlite3-dev
      - name: Build and validate
        run: |
          cmake -S audio/vst3 -B build/audio -DCMAKE_BUILD_TYPE=Release
          cmake --build build/audio --config Release --parallel --target LogMetaRawAudio

  macos:
    # Compiles the plugin (Metal included) and runs the whole suite on a real Mac. It builds with CMake against the
    # public OpenFX SDK, as the .dmg of release.yml does (packaging/build_installer.sh).
    runs-on: macos-15    # the Metal code uses macOS 15 API (guarded): it needs the macOS 15 SDK to compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the plugin and the test helpers
        run: |
          cmake -S ofx/SLogMetaRaw -B ofx/SLogMetaRaw/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ofx/SLogMetaRaw/build --parallel
      - name: Unit tests
        # the GitHub runners may expose no Metal device: the GPU parity tests skip themselves then
        timeout-minutes: 15
        run: |
          set -o pipefail
          python3 -X utf8 -m unittest discover -s tests -v 2>&1 | tee tests.log
      - name: What the Mac tests skipped
        if: always()
        run: |
          grep -o "skipped '.*'" tests.log | sort | uniq -c | sort -rn || true
          grep -E "\.\.\. (ERROR|FAIL)$" tests.log || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (Python; the C++ helpers are built with MSVC by the package step)
        timeout-minutes: 10
        run: python -X utf8 -m unittest discover -s tests
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe
