name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Version consistency
        run: python3 tools/check_version.py
      - name: Unit tests (builds the plugin and the C++ test helpers with CMake)
        # macOS-only tests (Metal, sample clips, install.sh) skip themselves on Linux
        run: python3 -m unittest discover -s tests -v

  linux-packages:
    uses: ./.github/workflows/linux-packages.yml

  macos:
    # Compiles the plugin (Metal included) and runs the whole suite on a real Mac. It builds with CMake against the
    # public OpenFX SDK: the .dmg release itself is still built on a Mac with Resolve (packaging/build_installer.sh).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the plugin and the test helpers
        run: |
          cmake -S ofx/SLogMetaRaw -B ofx/SLogMetaRaw/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ofx/SLogMetaRaw/build --parallel
      - name: Unit tests
        # the GitHub runners may expose no Metal device: the GPU parity tests are the ones to watch
        continue-on-error: true
        timeout-minutes: 15
        run: python3 -X utf8 -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (Python; the C++ helpers are built with MSVC by the package step)
        continue-on-error: true   # the suite was written for macOS: tighten once it is green on Windows
        timeout-minutes: 10
        run: python -X utf8 -m unittest discover -s tests
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe
